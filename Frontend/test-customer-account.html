<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Customer Account - Debug Tool</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container { max-width: 1200px; margin: 0 auto; }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }
        
        h1 { color: #2c3e50; margin-bottom: 10px; }
        
        .subtitle { color: #7f8c8d; font-size: 1.1rem; }
        
        .test-section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .section-title {
            color: #2c3e50;
            font-size: 1.3rem;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ecf0f1;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .btn-primary { background: #3498db; color: white; }
        .btn-primary:hover { background: #2980b9; transform: translateY(-2px); }
        
        .btn-success { background: #27ae60; color: white; }
        .btn-success:hover { background: #229954; transform: translateY(-2px); }
        
        .btn-warning { background: #f39c12; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        
        .result-box {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .result-box pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }
        
        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            margin: 5px;
        }
        
        .status-success { background: #d4edda; color: #27ae60; }
        .status-error { background: #f8d7da; color: #e74c3c; }
        .status-warning { background: #fff3cd; color: #f39c12; }
        
        .info-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin: 15px 0;
        }
        
        .info-card h3 { margin-bottom: 15px; }
        .info-card p { margin: 8px 0; font-size: 1.1rem; }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #2c3e50;
        }
        
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 Test Customer Account - Debug Tool</h1>
            <p class="subtitle">Test tài khoản khách hàng - Load & Update từ database</p>
            <p style="margin-top: 10px; color: #e74c3c; font-weight: 600;">
                ⚠️ Test với user: nguyenvana (ID=2)
            </p>
        </div>

        <!-- Step 1: Check Backend -->
        <div class="test-section">
            <div class="section-title">📡 Bước 1: Kiểm tra Backend API</div>
            <div class="button-group">
                <button class="btn-primary" onclick="checkBackend()">✓ Check Backend</button>
                <button class="btn-primary" onclick="testNguoiDungAPI()">Test NguoiDung API</button>
            </div>
            <div id="backend-result" class="result-box" style="display:none;"></div>
        </div>

        <!-- Step 2: Load Customer Info -->
        <div class="test-section">
            <div class="section-title">👤 Bước 2: Load thông tin tài khoản</div>
            <div class="button-group">
                <button class="btn-primary" onclick="loadCustomer()">Load Customer (ID=2)</button>
            </div>
            <div id="customer-result" class="result-box" style="display:none;"></div>
        </div>

        <!-- Step 3: Update Customer Info -->
        <div class="test-section">
            <div class="section-title">✏️ Bước 3: Cập nhật thông tin</div>
            <div class="form-group">
                <label>Họ tên:</label>
                <input type="text" id="update-fullname" placeholder="Nguyễn Văn A">
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="update-email" placeholder="nguyenvana@example.com">
            </div>
            <div class="form-group">
                <label>Địa chỉ:</label>
                <input type="text" id="update-address" placeholder="123 Đường ABC, Hà Nội">
            </div>
            <div class="button-group">
                <button class="btn-success" onclick="updateCustomer()">💾 Update Customer Info</button>
            </div>
            <div id="update-result" class="result-box" style="display:none;"></div>
        </div>

        <!-- Step 4: Full Test -->
        <div class="test-section">
            <div class="section-title">🚀 Bước 4: Test tổng hợp</div>
            <div class="button-group">
                <button class="btn-success" onclick="runFullTest()">▶️ Run Full Test</button>
                <button class="btn-warning" onclick="clearResults()">🗑️ Clear All</button>
            </div>
            <div id="final-result" class="result-box" style="display:none;"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5257/api';
        let customerData = null;

        function log(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            element.style.display = 'block';
            
            const timestamp = new Date().toLocaleTimeString('vi-VN');
            const icon = type === 'success' ? '✓' : type === 'error' ? '✗' : 'ℹ';
            const statusClass = type === 'success' ? 'status-success' : type === 'error' ? 'status-error' : 'status-warning';
            
            element.innerHTML += `<div class="status ${statusClass}">${icon} [${timestamp}] ${message}</div>\n`;
        }

        function logJSON(elementId, title, data) {
            const element = document.getElementById(elementId);
            element.style.display = 'block';
            element.innerHTML += `<pre><strong>${title}:</strong>\n${JSON.stringify(data, null, 2)}</pre>\n`;
        }

        async function checkBackend() {
            log('backend-result', 'Checking backend health...', 'info');
            
            try {
                const response = await fetch(`${API_BASE}/NguoiDung`);
                if (response.ok) {
                    log('backend-result', `Backend API is running! Status: ${response.status}`, 'success');
                } else {
                    log('backend-result', `Backend returned status: ${response.status}`, 'error');
                }
            } catch (error) {
                log('backend-result', `Cannot connect to backend: ${error.message}`, 'error');
            }
        }

        async function testNguoiDungAPI() {
            log('backend-result', 'Testing NguoiDung API endpoints...', 'info');
            
            try {
                // Test get all
                const response = await fetch(`${API_BASE}/NguoiDung`);
                const data = await response.json();
                log('backend-result', `GET /NguoiDung works! Found ${data.length} users`, 'success');
                
                // Test get by id
                const response2 = await fetch(`${API_BASE}/NguoiDung/get-by-id/2`);
                const user = await response2.json();
                log('backend-result', `GET /NguoiDung/get-by-id/2 works! User: ${user.hoTen}`, 'success');
                logJSON('backend-result', 'Sample User', user);
            } catch (error) {
                log('backend-result', `NguoiDung API error: ${error.message}`, 'error');
            }
        }

        async function loadCustomer() {
            log('customer-result', 'Loading customer ID=2 (nguyenvana)...', 'info');
            
            try {
                const response = await fetch(`${API_BASE}/NguoiDung/get-by-id/2`);
                customerData = await response.json();
                
                log('customer-result', `Customer loaded successfully!`, 'success');
                log('customer-result', `Name: ${customerData.hoTen}`, 'info');
                log('customer-result', `Email: ${customerData.email}`, 'info');
                log('customer-result', `Phone: ${customerData.soDienThoai}`, 'info');
                log('customer-result', `Address: ${customerData.diaChi || 'N/A'}`, 'info');
                
                logJSON('customer-result', 'Full Customer Data', customerData);
                
                // Pre-fill update form
                document.getElementById('update-fullname').value = customerData.hoTen || '';
                document.getElementById('update-email').value = customerData.email || '';
                document.getElementById('update-address').value = customerData.diaChi || '';
            } catch (error) {
                log('customer-result', `Error loading customer: ${error.message}`, 'error');
            }
        }

        async function updateCustomer() {
            if (!customerData) {
                log('update-result', 'Please load customer first!', 'error');
                return;
            }
            
            const hoTen = document.getElementById('update-fullname').value;
            const email = document.getElementById('update-email').value;
            const diaChi = document.getElementById('update-address').value;
            
            if (!hoTen || !email) {
                log('update-result', 'Họ tên và Email không được để trống!', 'error');
                return;
            }
            
            log('update-result', 'Updating customer info...', 'info');
            
            const updateData = {
                MaNguoiDung: customerData.maNguoiDung,
                HoTen: hoTen,
                TenDangNhap: customerData.tenDangNhap,
                Email: email,
                SoDienThoai: customerData.soDienThoai,
                DiaChi: diaChi,
                VaiTro: customerData.vaiTro
            };
            
            try {
                const response = await fetch(`${API_BASE}/NguoiDung/update`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(updateData)
                });
                
                if (response.ok) {
                    log('update-result', '✅ Customer info updated successfully!', 'success');
                    logJSON('update-result', 'Updated Data', updateData);
                    
                    // Reload customer
                    await loadCustomer();
                } else {
                    const error = await response.text();
                    log('update-result', `Update failed: ${error}`, 'error');
                }
            } catch (error) {
                log('update-result', `Error updating customer: ${error.message}`, 'error');
            }
        }

        async function runFullTest() {
            document.getElementById('final-result').innerHTML = '';
            log('final-result', '🚀 Starting full test...', 'info');
            
            // Step 1: Backend
            log('final-result', 'Step 1: Checking backend...', 'info');
            await checkBackend();
            await new Promise(r => setTimeout(r, 500));
            
            // Step 2: Load customer
            log('final-result', 'Step 2: Loading customer...', 'info');
            await loadCustomer();
            await new Promise(r => setTimeout(r, 500));
            
            if (!customerData) {
                log('final-result', 'Failed to load customer. Stopping test.', 'error');
                return;
            }
            
            log('final-result', '✅ Test completed!', 'success');
            
            const summary = {
                customer: {
                    id: customerData.maNguoiDung,
                    username: customerData.tenDangNhap,
                    name: customerData.hoTen,
                    email: customerData.email,
                    phone: customerData.soDienThoai,
                    address: customerData.diaChi,
                    role: customerData.vaiTro
                }
            };
            
            logJSON('final-result', 'FINAL SUMMARY', summary);
        }

        function clearResults() {
            ['backend-result', 'customer-result', 'update-result', 'final-result'].forEach(id => {
                const element = document.getElementById(id);
                element.innerHTML = '';
                element.style.display = 'none';
            });
            
            customerData = null;
        }

        // Auto-run on load
        window.onload = () => {
            console.log('Test Customer Account tool loaded');
        };
    </script>
</body>
</html>
