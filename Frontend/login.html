<!DOCTYPE html>
<html lang="vi" ng-app="logisticsApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Hệ thống Quản lý Logistics</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="login-style.css">
</head>
<body ng-controller="LoginController">
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <i class="fas fa-truck-moving"></i>
                <h1>Logistics Manager</h1>
                <p>Hệ thống quản lý vận chuyển</p>
            </div>
            
            <form id="login-form" class="login-form" ng-submit="login()">
                <div class="alert alert-danger" ng-show="errors.general" style="display: block;">
                    <i class="fas fa-exclamation-circle"></i>
                    <span>{{errors.general}}</span>
                </div>
                
                <div class="form-group">
                    <label for="username" class="form-label">
                        <i class="fas fa-user"></i> Tên đăng nhập
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form-control" 
                        ng-class="{'error': errors.username}"
                        ng-model="loginData.username"
                        ng-change="clearError('username')"
                        placeholder="Nhập tên đăng nhập"
                        required
                        autocomplete="username"
                    >
                    <span class="error-text" ng-show="errors.username">{{errors.username}}</span>
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">
                        <i class="fas fa-lock"></i> Mật khẩu
                    </label>
                    <div class="password-input-wrapper">
                        <input 
                            type="{{showPassword ? 'text' : 'password'}}" 
                            id="password" 
                            name="password" 
                            class="form-control" 
                            ng-class="{'error': errors.password}"
                            ng-model="loginData.password"
                            ng-change="clearError('password')"
                            placeholder="Nhập mật khẩu"
                            required
                            autocomplete="current-password"
                        >
                        <button type="button" class="toggle-password" ng-click="togglePassword()">
                            <i class="fas" ng-class="{'fa-eye': !showPassword, 'fa-eye-slash': showPassword}"></i>
                        </button>
                    </div>
                    <span class="error-text" ng-show="errors.password">{{errors.password}}</span>
                </div>
                
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember-me" name="remember" ng-model="loginData.rememberMe">
                        <span>Ghi nhớ đăng nhập</span>
                    </label>
                    <a href="#" class="forgot-password" ng-click="forgotPassword()">Quên mật khẩu?</a>
                </div>
                
                <button type="submit" class="btn-login" id="login-btn" ng-disabled="isLoading" ng-class="{'loading': isLoading}">
                    <i class="fas" ng-class="{'fa-spinner': isLoading, 'fa-sign-in-alt': !isLoading}"></i> 
                    {{isLoading ? 'Đang đăng nhập...' : 'Đăng nhập'}}
                </button>
                
                <div class="demo-credentials">
                    <p><strong>Tài khoản demo:</strong></p>
                    <p><i class="fas fa-user-shield"></i> Admin: <code>admin</code> / <code>admin123</code></p>
                    <p><i class="fas fa-truck"></i> Tài xế: <code>driver1</code> / <code>driver123</code></p>
                    <p><i class="fas fa-user"></i> Khách hàng: <code>customer1</code> / <code>customer123</code></p>
                </div>
            </form>
            
            <div class="login-footer">
                <p>&copy; 2025 Logistics Manager. All rights reserved.</p>
            </div>
        </div>
    </div>

    <!-- AngularJS -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    
    <!-- App Config and Services -->
    <script src="app.config.js"></script>
    <script src="services/api.service.js"></script>
    
    <!-- Controllers -->
    <script src="controllers/login.controller.js"></script>
</body>
</html>
