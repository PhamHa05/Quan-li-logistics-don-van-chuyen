<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test My Orders - Debug Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2rem;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        .test-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }
        
        .test-section h3 {
            color: #2c3e50;
            margin-bottom: 15px;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #27ae60, #229954);
            color: white;
        }
        
        .btn-info {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
        }
        
        .status {
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.9rem;
        }
        
        .status.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        
        .status.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        
        .status.info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
        
        .console-output {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.85rem;
            line-height: 1.5;
            margin-top: 15px;
        }
        
        .console-output div {
            margin-bottom: 5px;
        }
        
        .console-output .success {
            color: #2ecc71;
        }
        
        .console-output .error {
            color: #e74c3c;
        }
        
        .console-output .info {
            color: #3498db;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        table th, table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        table th {
            background: #667eea;
            color: white;
        }
        
        table tr:hover {
            background: #f8f9fa;
        }
        
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .badge-success {
            background: #27ae60;
            color: white;
        }
        
        .badge-warning {
            background: #f39c12;
            color: white;
        }
        
        .badge-info {
            background: #3498db;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test My Orders</h1>
        <p class="subtitle">Debug tool to test customer orders loading from database</p>
        
        <!-- Test 1: Check Backend API -->
        <div class="test-section">
            <h3>🔌 Test 1: Kiểm tra Backend API</h3>
            <button class="btn btn-info" onclick="testBackendAPI()">
                ▶️ Test Backend API
            </button>
            <div id="api-status"></div>
        </div>
        
        <!-- Test 2: Load Customer Info -->
        <div class="test-section">
            <h3>👤 Test 2: Load Thông tin Khách hàng</h3>
            <button class="btn btn-primary" onclick="testLoadCustomerInfo()">
                ▶️ Load Customer Info (ID=2)
            </button>
            <div id="customer-status"></div>
        </div>
        
        <!-- Test 3: Load All Orders -->
        <div class="test-section">
            <h3>📦 Test 3: Load Tất cả đơn hàng</h3>
            <button class="btn btn-primary" onclick="testLoadAllOrders()">
                ▶️ Load All Orders
            </button>
            <div id="all-orders-status"></div>
        </div>
        
        <!-- Test 4: Filter Customer Orders -->
        <div class="test-section">
            <h3>🔍 Test 4: Lọc đơn hàng của khách hàng</h3>
            <button class="btn btn-success" onclick="testFilterCustomerOrders()">
                ▶️ Filter Customer Orders (Phone: 0911222333)
            </button>
            <div id="filter-status"></div>
        </div>
        
        <!-- Console Output -->
        <div class="test-section">
            <h3>📄 Console Output</h3>
            <div class="console-output" id="console"></div>
        </div>
    </div>
    
    <script>
        const API_BASE_URL = 'http://localhost:5257/api';
        let customerData = null;
        let allOrders = [];
        let customerOrders = [];
        
        // Console logger
        function log(message, type = 'info') {
            const console = document.getElementById('console');
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = type;
            div.innerHTML = `<span style="color: #95a5a6;">[${time}]</span> ${message}`;
            console.appendChild(div);
            console.scrollTop = console.scrollHeight;
            window.console.log(`[${time}] ${message}`);
        }
        
        // Show status
        function showStatus(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            element.className = `status ${type}`;
            element.innerHTML = message;
        }
        
        // Test 1: Backend API
        async function testBackendAPI() {
            log('Testing backend API...', 'info');
            showStatus('api-status', '⏳ Đang kiểm tra...', 'info');
            
            try {
                const response = await fetch(`${API_BASE_URL}/DonVanChuyen/search`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ PageIndex: 1, PageSize: 10 })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const total = data.TotalItems || data.totalItems || 0;
                    log(`✅ Backend API OK! Total orders: ${total}`, 'success');
                    showStatus('api-status', 
                        `✅ Backend API đang chạy!<br>Total orders in database: ${total}`, 
                        'success'
                    );
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                log(`❌ Backend API Error: ${error.message}`, 'error');
                showStatus('api-status', 
                    `❌ Backend API KHÔNG phản hồi!<br>Error: ${error.message}<br><br>⚠️ Vui lòng chạy backend:<br>cd TestAPI; dotnet run`, 
                    'error'
                );
            }
        }
        
        // Test 2: Load Customer
        async function testLoadCustomerInfo() {
            log('Loading customer info (ID=2)...', 'info');
            showStatus('customer-status', '⏳ Đang tải...', 'info');
            
            try {
                const response = await fetch(`${API_BASE_URL}/NguoiDung/get-by-id/2`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                if (response.ok) {
                    customerData = await response.json();
                    log(`✅ Customer loaded: ${customerData.hoTen}`, 'success');
                    log(`   Phone: ${customerData.soDienThoai}`, 'info');
                    log(`   Email: ${customerData.email}`, 'info');
                    log(`   Address: ${customerData.diaChi}`, 'info');
                    
                    showStatus('customer-status', 
                        `✅ Thông tin khách hàng đã load từ database!<br><br>
                        <strong>ID:</strong> ${customerData.maNguoiDung}<br>
                        <strong>Tên:</strong> ${customerData.hoTen}<br>
                        <strong>SĐT:</strong> ${customerData.soDienThoai}<br>
                        <strong>Email:</strong> ${customerData.email}<br>
                        <strong>Địa chỉ:</strong> ${customerData.diaChi}<br>
                        <strong>Vai trò:</strong> ${customerData.vaiTro}`, 
                        'success'
                    );
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                log(`❌ Load customer error: ${error.message}`, 'error');
                showStatus('customer-status', 
                    `❌ Không thể load thông tin khách hàng!<br>Error: ${error.message}`, 
                    'error'
                );
            }
        }
        
        // Test 3: Load All Orders
        async function testLoadAllOrders() {
            log('Loading all orders from database...', 'info');
            showStatus('all-orders-status', '⏳ Đang tải...', 'info');
            
            try {
                const response = await fetch(`${API_BASE_URL}/DonVanChuyen/search`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ PageIndex: 1, PageSize: 1000 })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    allOrders = result.Data || result.data || [];
                    log(`✅ Loaded ${allOrders.length} orders from database`, 'success');
                    
                    // Show sample data
                    if (allOrders.length > 0) {
                        log('Sample order data:', 'info');
                        const sample = allOrders[0];
                        log(`   maVanDon: ${sample.maVanDon}`, 'info');
                        log(`   tenNguoiGui: ${sample.tenNguoiGui}`, 'info');
                        log(`   sdtNguoiGui: ${sample.sdtNguoiGui}`, 'info');
                        log(`   tenNguoiNhan: ${sample.tenNguoiNhan}`, 'info');
                        log(`   trangThai: ${sample.trangThai}`, 'info');
                    }
                    
                    // Create table
                    let tableHTML = `
                        ✅ Đã load ${allOrders.length} đơn hàng từ database!<br><br>
                        <table>
                            <thead>
                                <tr>
                                    <th>Mã vận đơn</th>
                                    <th>Người gửi</th>
                                    <th>SĐT gửi</th>
                                    <th>Người nhận</th>
                                    <th>Trạng thái</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;
                    
                    allOrders.slice(0, 10).forEach(order => {
                        tableHTML += `
                            <tr>
                                <td>${order.maVanDon || 'N/A'}</td>
                                <td>${order.tenNguoiGui || 'N/A'}</td>
                                <td>${order.sdtNguoiGui || 'N/A'}</td>
                                <td>${order.tenNguoiNhan || 'N/A'}</td>
                                <td><span class="badge badge-info">${order.trangThai || 'N/A'}</span></td>
                            </tr>
                        `;
                    });
                    
                    tableHTML += `</tbody></table>`;
                    if (allOrders.length > 10) {
                        tableHTML += `<br><small>Showing first 10 of ${allOrders.length} orders</small>`;
                    }
                    
                    showStatus('all-orders-status', tableHTML, 'success');
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                log(`❌ Load orders error: ${error.message}`, 'error');
                showStatus('all-orders-status', 
                    `❌ Không thể load đơn hàng!<br>Error: ${error.message}`, 
                    'error'
                );
            }
        }
        
        // Test 4: Filter Customer Orders
        async function testFilterCustomerOrders() {
            if (!customerData) {
                alert('Vui lòng chạy Test 2 trước để load thông tin khách hàng!');
                return;
            }
            
            if (allOrders.length === 0) {
                alert('Vui lòng chạy Test 3 trước để load tất cả đơn hàng!');
                return;
            }
            
            log('Filtering customer orders...', 'info');
            showStatus('filter-status', '⏳ Đang lọc...', 'info');
            
            const customerPhone = customerData.soDienThoai;
            log(`Filtering by customer phone: ${customerPhone}`, 'info');
            
            customerOrders = allOrders.filter(order => {
                const orderPhone = order.sdtNguoiGui || '';
                return orderPhone === customerPhone;
            });
            
            log(`✅ Found ${customerOrders.length} orders for customer`, 'success');
            
            if (customerOrders.length > 0) {
                let tableHTML = `
                    ✅ Tìm thấy ${customerOrders.length} đơn hàng của khách hàng!<br>
                    <small>Lọc theo SĐT: ${customerPhone}</small><br><br>
                    <table>
                        <thead>
                            <tr>
                                <th>Mã vận đơn</th>
                                <th>Người nhận</th>
                                <th>SĐT nhận</th>
                                <th>Địa chỉ giao</th>
                                <th>Trạng thái</th>
                                <th>Ngày tạo</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                customerOrders.forEach(order => {
                    const statusClass = order.trangThai === 'GIAO_THANH_CONG' ? 'success' : 
                                       order.trangThai === 'CHO_LAY_HANG' ? 'warning' : 'info';
                    tableHTML += `
                        <tr>
                            <td><strong>${order.maVanDon || 'N/A'}</strong></td>
                            <td>${order.tenNguoiNhan || 'N/A'}</td>
                            <td>${order.sdtNguoiNhan || 'N/A'}</td>
                            <td>${order.diaChiGiaoHang || 'N/A'}</td>
                            <td><span class="badge badge-${statusClass}">${order.trangThai || 'N/A'}</span></td>
                            <td>${new Date(order.thoiGianTao).toLocaleDateString('vi-VN')}</td>
                        </tr>
                    `;
                });
                
                tableHTML += `</tbody></table>`;
                showStatus('filter-status', tableHTML, 'success');
                
                // Log stats
                const stats = {
                    total: customerOrders.length,
                    pending: customerOrders.filter(o => o.trangThai === 'CHO_LAY_HANG').length,
                    delivering: customerOrders.filter(o => o.trangThai === 'DANG_GIAO' || o.trangThai === 'DA_LAY_HANG').length,
                    completed: customerOrders.filter(o => o.trangThai === 'GIAO_THANH_CONG').length,
                    failed: customerOrders.filter(o => o.trangThai === 'THAT_BAI').length
                };
                
                log('📊 Statistics:', 'info');
                log(`   Total: ${stats.total}`, 'info');
                log(`   Pending: ${stats.pending}`, 'info');
                log(`   Delivering: ${stats.delivering}`, 'info');
                log(`   Completed: ${stats.completed}`, 'info');
                log(`   Failed: ${stats.failed}`, 'info');
            } else {
                showStatus('filter-status', 
                    `⚠️ Không tìm thấy đơn hàng nào cho khách hàng!<br>
                    SĐT khách hàng: ${customerPhone}<br><br>
                    Có thể do:<br>
                    • Khách hàng chưa tạo đơn hàng nào<br>
                    • Số điện thoại trong đơn hàng khác với số điện thoại khách hàng<br>
                    • Cần tạo đơn hàng mới để test`, 
                    'info'
                );
            }
        }
        
        // Auto-run on load
        window.onload = function() {
            log('='.repeat(50), 'info');
            log('Test My Orders Tool Loaded', 'info');
            log('='.repeat(50), 'info');
            
            setTimeout(() => {
                testBackendAPI();
            }, 500);
        };
    </script>
</body>
</html>
